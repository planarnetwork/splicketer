name: Test

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '26']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - run: npm ci
      # biome, tsc and vitest
      - run: npm test
      - run: npm run build
      - run: npm ci --prefix site
      # tsc and vite, which also checks the split file reader builds for a browser
      - run: npm run build --prefix site
